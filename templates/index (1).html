<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 340px; background: #1e1e1e; border-right: 1px solid #333; padding: 20px; overflow-y: auto; flex-shrink: 0; }
        #sidebar h2 { font-size: 1.2rem; color: #4da6ff; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .filter-group { margin-bottom: 20px; }
        .filter-group h3 { font-size: .85rem; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
        input[type="text"] { width: 100%; padding: 8px 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; margin-bottom: 10px; outline: none; font-size: .9rem; }
        input[type="text"]:focus { border-color: #4da6ff; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; background: #252525; padding: 8px; border-radius: 4px; border: 1px solid #333; }
        .tag-badge { background: #333; color: #ccc; padding: 5px 10px; border: 0; border-radius: 12px; font-size: .8rem; cursor: pointer; transition: background .2s; }
        .tag-badge:hover { background: #444; color: #fff; }
        .tag-badge.selected-parent { background: #28a745; color: #fff; }
        .tag-badge.selected-sub { background: #e67e22; color: #fff; }
        .tag-badge.selected-content { background: #0066cc; color: #fff; }
        .btn-reset { width: 100%; padding: 10px; background: #333; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: .85rem; }
        .btn-reset:hover { background: #444; }
        #main-content { flex-grow: 1; min-width: 0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        #top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e1e1e; padding: 12px 20px; border-radius: 6px; border: 1px solid #333; }
        #file-count { color: #aaa; font-size: .9rem; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, border-color .2s; cursor: pointer; }
        .card:hover { transform: translateY(-3px); border-color: #4da6ff; }
        .card-preview { width: 100%; height: 180px; background: #0a0a0a; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .card-preview img { width: 100%; height: 100%; object-fit: cover; }
        .file-icon { font-size: 2.2rem; color: #666; text-transform: uppercase; font-weight: bold; }
        .video-badge { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; padding: 4px 7px; border-radius: 4px; font-size: .75rem; pointer-events: none; }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: .85rem; font-weight: 600; color: #fff; margin-bottom: 8px; word-break: break-word; line-height: 1.3; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 8px; }
        .card-tag { font-size: .7rem; background: #2a2a2a; color: #888; padding: 2px 6px; border-radius: 3px; }
        .empty-message { color: #888; grid-column: 1 / -1; text-align: center; padding: 40px; }
        @media (max-width: 700px) { body { flex-direction: column; overflow: auto; height: auto; min-height: 100vh; } #sidebar { width: 100%; max-height: 45vh; border-right: 0; border-bottom: 1px solid #333; } #main-content { overflow: visible; } }
    </style>
</head>
<body>
    <aside id="sidebar">
        <h2>Collection Browser</h2>
        <div class="filter-group">
            <h3>Cerca nome file</h3>
            <input type="text" id="search-input" placeholder="Es: Barbarian, Captain...">
        </div>
        <div class="filter-group">
            <h3>1. Cartelle padre (OR)</h3>
            <div id="parents-container" class="tags-container"></div>
        </div>
        <div class="filter-group">
            <h3>2. Sottocartelle (OR)</h3>
            <div id="subs-container" class="tags-container"></div>
        </div>
        <div class="filter-group">
            <h3>3. Tag contenuto (AND)</h3>
            <div id="tags-container" class="tags-container"></div>
        </div>
        <button class="btn-reset" id="reset-filters" type="button">Azzera filtri</button>
    </aside>
    <main id="main-content">
        <div id="top-bar"><span id="file-count">Caricamento in corso...</span></div>
        <div id="cards-grid" class="cards-grid"></div>
    </main>
    <script>
        const selectedParents = new Set();
        const selectedSubs = new Set();
        const selectedTags = new Set();
        const imageExtensions = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'tif', 'tiff']);
        const videoExtensions = new Set(['mp4', 'mkv', 'avi', 'mov', 'wmv', 'flv', 'webm']);
        let filesRequestId = 0;

        document.addEventListener('DOMContentLoaded', () => {
            loadParentFolders();
            loadSubFolders();
            loadContentTags();
            fetchFiles();
            document.getElementById('search-input').addEventListener('input', fetchFiles);
            document.getElementById('reset-filters').addEventListener('click', resetFilters);
        });

        function appendValues(params, name, values) {
            values.forEach(value => params.append(name, value));
        }

        async function getJson(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${url}`);
            return response.json();
        }

        function makeBadge(label, id, selectedSet, selectedClass, onChange) {
            const badge = document.createElement('button');
            badge.type = 'button';
            badge.className = 'tag-badge';
            badge.classList.toggle(selectedClass, selectedSet.has(id));
            badge.setAttribute('aria-pressed', String(selectedSet.has(id)));
            badge.textContent = label;
            badge.addEventListener('click', () => {
                if (selectedSet.has(id)) selectedSet.delete(id);
                else selectedSet.add(id);
                badge.classList.toggle(selectedClass, selectedSet.has(id));
                badge.setAttribute('aria-pressed', String(selectedSet.has(id)));
                onChange();
            });
            return badge;
        }

        async function loadParentFolders() {
            try {
                const parents = await getJson('/api/parent-folders');
                const container = document.getElementById('parents-container');
                container.replaceChildren();
                parents.forEach(parent => container.appendChild(makeBadge(
                    parent.name.replace(/^Padre:/, '').trim(), String(parent.id),
                    selectedParents, 'selected-parent', () => {
                        loadSubFolders();
                        loadContentTags();
                        fetchFiles();
                    }
                )));
            } catch (error) { console.error('Errore caricamento cartelle padre:', error); }
        }

        async function loadSubFolders() {
            const params = new URLSearchParams();
            appendValues(params, 'parents', selectedParents);
            const query = params.toString();
            try {
                const subs = await getJson('/api/sub-folders' + (query ? '?' + query : ''));
                if (query !== (() => { const current = new URLSearchParams(); appendValues(current, 'parents', selectedParents); return current.toString(); })()) return;
                const container = document.getElementById('subs-container');
                container.replaceChildren();
                subs.forEach(sub => container.appendChild(makeBadge(
                    sub.name.replace(/^Sub:/, '').trim(), String(sub.id),
                    selectedSubs, 'selected-sub', () => {
                        loadContentTags();
                        fetchFiles();
                    }
                )));
            } catch (error) { console.error('Errore caricamento sottocartelle:', error); }
        }

        async function loadContentTags() {
            const params = new URLSearchParams();
            appendValues(params, 'parents', selectedParents);
            appendValues(params, 'subs', selectedSubs);
            const query = params.toString();
            try {
                const tags = await getJson('/api/content-tags' + (query ? '?' + query : ''));
                const current = new URLSearchParams();
                appendValues(current, 'parents', selectedParents);
                appendValues(current, 'subs', selectedSubs);
                if (query !== current.toString()) return;
                const container = document.getElementById('tags-container');
                container.replaceChildren();
                tags.forEach(tag => container.appendChild(makeBadge(
                    tag.name, String(tag.id), selectedTags, 'selected-content', fetchFiles
                )));
            } catch (error) { console.error('Errore caricamento tag:', error); }
        }

        async function fetchFiles() {
            const requestId = ++filesRequestId;
            const params = new URLSearchParams();
            const query = document.getElementById('search-input').value.trim();
            if (query) params.set('q', query);
            appendValues(params, 'parents', selectedParents);
            appendValues(params, 'subs', selectedSubs);
            appendValues(params, 'tags', selectedTags);
            try {
                const files = await getJson('/api/files?' + params.toString());
                if (requestId === filesRequestId) renderCards(files);
            } catch (error) {
                if (requestId !== filesRequestId) return;
                console.error('Errore recupero file:', error);
                document.getElementById('file-count').textContent = 'Errore caricamento file';
            }
        }

        // Le anteprime video partono solo quando la scheda entra (o sta per entrare)
        // nell'area visibile. Al massimo tre video vengono decodificati insieme.
        const thumbnailQueue = [];
        const activeThumbnailJobs = new Set();
        let thumbnailGeneration = 0;
        const thumbnailObserver = new IntersectionObserver(entries => {
            for (const entry of entries) {
                if (!entry.isIntersecting) continue;
                thumbnailObserver.unobserve(entry.target);
                const job = entry.target.thumbnailJob;
                if (job) {
                    thumbnailQueue.push(job);
                    delete entry.target.thumbnailJob;
                }
            }
            processThumbnailQueue();
        }, {
            root: document.getElementById('main-content'),
            rootMargin: '350px 0px',
            threshold: 0
        });

        function processThumbnailQueue() {
            while (activeThumbnailJobs.size < 3 && thumbnailQueue.length) {
                const job = thumbnailQueue.shift();
                if (job.generation !== thumbnailGeneration) continue;
                activeThumbnailJobs.add(job);
                createVideoThumbnail(job).finally(() => {
                    activeThumbnailJobs.delete(job);
                    processThumbnailQueue();
                });
            }
        }

        function createVideoThumbnail(job) {
            return new Promise(resolve => {
                const { mediaUrl, filename, preview, icon, generation } = job;
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.muted = true;
                video.playsInline = true;
                let finished = false;
                const timeout = setTimeout(finish, 15000);

                function finish(img = null) {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timeout);
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                    if (generation === thumbnailGeneration && preview.isConnected) {
                        if (img) {
                            preview.insertBefore(img, icon);
                            icon.hidden = true;
                        } else {
                            icon.hidden = false;
                        }
                    }
                    resolve();
                }

                video.addEventListener('error', () => finish(), { once: true });
                video.addEventListener('loadedmetadata', () => {
                    const duration = video.duration;
                    const targetTime = Number.isFinite(duration) && duration > 0
                        ? (duration > 1 ? 1 : duration / 2)
                        : 1;
                    try {
                        video.currentTime = targetTime;
                    } catch (error) {
                        finish();
                    }
                }, { once: true });
                video.addEventListener('seeked', () => {
                    if (finished || !video.videoWidth || !video.videoHeight) {
                        finish();
                        return;
                    }
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.min(320, video.videoWidth);
                        canvas.height = Math.round(canvas.width * video.videoHeight / video.videoWidth);
                        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                        const img = document.createElement('img');
                        img.src = canvas.toDataURL('image/jpeg', 0.8);
                        img.alt = 'Anteprima di ' + filename;
                        finish(img);
                    } catch (error) {
                        console.warn('Anteprima video non disponibile:', filename, error);
                        finish();
                    }
                }, { once: true });
                job.cancel = () => finish();
                video.src = mediaUrl;
                video.load();
            });
        }

        function renderCards(files) {
            const grid = document.getElementById('cards-grid');
            document.getElementById('file-count').textContent = `Trovati ${files.length} file`;
            thumbnailGeneration++;
            thumbnailObserver.disconnect();
            thumbnailQueue.length = 0;
            for (const job of activeThumbnailJobs) job.cancel?.();
            grid.replaceChildren();
            if (!files.length) {
                const message = document.createElement('p');
                message.className = 'empty-message';
                message.textContent = 'Nessun file trovato con i filtri selezionati.';
                grid.appendChild(message);
                return;
            }
            const fragment = document.createDocumentFragment();
            const videoPreviews = [];
            files.forEach(file => {
                const card = document.createElement('div');
                card.className = 'card';
                card.addEventListener('dblclick', () => openFile(file.filepath));

                const preview = document.createElement('div');
                preview.className = 'card-preview';
                const extension = String(file.filename || file.filepath || '').split('.').pop().toLowerCase();
                const fallbackType = String(file.file_type || file.filetype || '').replace(/^\./, '').toLowerCase();
                const type = imageExtensions.has(extension) || videoExtensions.has(extension) ? extension : fallbackType;
                const isImage = imageExtensions.has(type);
                const isVideo = videoExtensions.has(type);
                const icon = document.createElement('span');
                icon.className = 'file-icon';
                icon.textContent = (type || 'FILE').toUpperCase();
                const mediaUrl = '/api/media?filepath=' + encodeURIComponent(file.filepath);

                if (isImage) {
                    const img = document.createElement('img');
                    img.src = mediaUrl;
                    img.alt = 'Anteprima di ' + file.filename;
                    img.loading = 'lazy';
                    icon.hidden = true;
                    img.addEventListener('error', () => {
                        img.remove();
                        icon.hidden = false;
                    });
                    preview.appendChild(img);
                }
                preview.appendChild(icon);
                if (isVideo) {
                    preview.thumbnailJob = {
                        mediaUrl, filename: file.filename, preview, icon,
                        generation: thumbnailGeneration
                    };
                    videoPreviews.push(preview);
                    const badge = document.createElement('span');
                    badge.className = 'video-badge';
                    badge.textContent = '▶ VIDEO';
                    preview.appendChild(badge);
                }

                const body = document.createElement('div');
                body.className = 'card-body';
                const title = document.createElement('div');
                title.className = 'card-title';
                title.title = file.filepath || '';
                title.textContent = file.filename || '';
                const tagsContainer = document.createElement('div');
                tagsContainer.className = 'card-tags';
                (file.tags || []).forEach(tag => {
                    const label = document.createElement('span');
                    label.className = 'card-tag';
                    label.textContent = typeof tag === 'object' ? tag.name : tag;
                    tagsContainer.appendChild(label);
                });
                body.append(title, tagsContainer);
                card.append(preview, body);
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
            videoPreviews.forEach(preview => thumbnailObserver.observe(preview));
        }

        async function openFile(filepath) {
            try {
                const response = await fetch('/api/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filepath })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
            } catch (error) { console.error('Errore apertura file:', error); }
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            selectedParents.clear();
            selectedSubs.clear();
            selectedTags.clear();
            loadParentFolders();
            loadSubFolders();
            loadContentTags();
            fetchFiles();
        }
    </script>
</body>
</html>
