<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Browser</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #121212; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; }
.sidebar { width: 340px; background: #1e1e1e; border-right: 1px solid #333; padding: 20px; overflow-y: auto; flex-shrink: 0; }
.sidebar h2 { font-size: 1.2rem; color: #4da6ff; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
.filter-group { margin-bottom: 20px; }
.filter-group h3 { font-size: .85rem; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
input[type=text] { width: 100%; padding: 8px 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; margin-bottom: 10px; outline: none; font-size: .9rem; }
input[type=text]:focus { border-color: #4da6ff; }
.tags-container { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; background: #252525; padding: 8px; border-radius: 4px; border: 1px solid #333; }
.tag-badge { background: #333; color: #ccc; padding: 5px 10px; border: 0; border-radius: 12px; font-size: .8rem; cursor: pointer; transition: background .2s; }
.tag-badge:hover { background: #444; color: #fff; }
.tag-badge.selected-parent { background: #28a745; color: #fff; }
.tag-badge.selected-sub { background: #e67e22; color: #fff; }
.tag-badge.selected-content { background: #0066cc; color: #fff; }
.btn-reset { width: 100%; padding: 10px; background: #333; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: .85rem; }
.btn-reset:hover { background: #444; }
main { flex-grow: 1; min-width: 0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e1e1e; padding: 12px 20px; border-radius: 6px; border: 1px solid #333; }
#file-count { color: #aaa; font-size: .9rem; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, border-color .2s; }
.card:hover { transform: translateY(-3px); border-color: #4da6ff; }
.card-preview { width: 100%; height: 180px; background: #0a0a0a; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.card-preview img { width: 100%; height: 100%; object-fit: cover; }
.file-icon { font-size: 2.2rem; color: #666; text-transform: uppercase; font-weight: bold; }
.video-badge { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; padding: 4px 7px; border-radius: 4px; font-size: .75rem; pointer-events: none; }
.card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
.card-title { font-size: .85rem; font-weight: 600; color: #fff; margin-bottom: 8px; word-break: break-word; line-height: 1.3; }
.card-path { color: #888; font-size: .72rem; line-height: 1.25; margin-bottom: 10px; word-break: break-all; }
.card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }
.card-action { flex: 1; padding: 7px 8px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: .75rem; }
.card-action:hover { background: #3a3a3a; color: #fff; border-color: #4da6ff; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 8px; }
.card-tag { font-size: .7rem; background: #2a2a2a; color: #888; padding: 2px 6px; border-radius: 3px; }
.empty-message { color: #888; grid-column: 1 / -1; text-align: center; padding: 40px; }
@media (max-width: 700px) { body { flex-direction: column; overflow: auto; height: auto; min-height: 100vh; } .sidebar { width: 100%; max-height: 45vh; border-right: 0; border-bottom: 1px solid #333; } main { overflow: visible; } }
</style>
</head>
<body>
<aside class="sidebar">
<h2>Collection Browser</h2>
<div class="filter-group"><h3>Cerca nome file</h3><input type="text" id="search-input" placeholder="Es. Barbarian, Captain..."></div>
<div class="filter-group"><h3>1. Cartelle padre OR</h3><div id="parents-container" class="tags-container"></div></div>
<div class="filter-group"><h3>2. Sottocartelle OR</h3><div id="subs-container" class="tags-container"></div></div>
<div class="filter-group"><h3>3. Tag contenuto AND</h3><div id="tags-container" class="tags-container"></div></div>
<button class="btn-reset" id="reset-filters" type="button">Azzera filtri</button>
</aside>
<main id="main-content">
<div class="top-bar"><span id="file-count">Caricamento in corso...</span></div>
<div id="cards-grid" class="cards-grid"></div>
</main>
<script>
const selectedParents = new Set();
const selectedSubs = new Set();
const selectedTags = new Set();
const imageExtensions = new Set(['jpg','jpeg','png','gif','webp','bmp','tif','tiff']);
const videoExtensions = new Set(['mp4','mkv','avi','mov','wmv','flv','webm']);
let filesRequestId = 0;
const thumbnailQueue = [];
const activeThumbnailJobs = new Set();
let thumbnailGeneration = 0;
const thumbnailObserver = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    thumbnailObserver.unobserve(entry.target);
    const job = entry.target.thumbnailJob;
    if (job) { thumbnailQueue.push(job); delete entry.target.thumbnailJob; processThumbnailQueue(); }
  }
}, { root: document.getElementById('main-content'), rootMargin: '350px 0px', threshold: 0 });
document.addEventListener('DOMContentLoaded', () => { loadParentFolders(); loadSubFolders(); loadContentTags(); fetchFiles(); });
document.getElementById('search-input').addEventListener('input', fetchFiles);
document.getElementById('reset-filters').addEventListener('click', resetFilters);
function appendValues(params, name, values) { values.forEach(value => params.append(name, value)); }
async function getJson(url) { const response = await fetch(url); if (!response.ok) throw new Error(`${response.status} ${response.statusText}`); return response.json(); }
function makeBadge(label, id, selectedSet, selectedClass, onChange) {
  const badge = document.createElement('button'); badge.type = 'button'; badge.className = 'tag-badge';
  badge.classList.toggle(selectedClass, selectedSet.has(id)); badge.setAttribute('aria-pressed', String(selectedSet.has(id))); badge.textContent = label;
  badge.addEventListener('click', () => { selectedSet.has(id) ? selectedSet.delete(id) : selectedSet.add(id); badge.classList.toggle(selectedClass, selectedSet.has(id)); badge.setAttribute('aria-pressed', String(selectedSet.has(id))); onChange(); });
  return badge;
}
async function loadParentFolders() { try { const parents = await getJson('/api/parent-folders'); const c = document.getElementById('parents-container'); c.replaceChildren(); parents.forEach(p => c.appendChild(makeBadge(p.name.replace('Padre:', '').trim(), String(p.id), selectedParents, 'selected-parent', () => { loadSubFolders(); loadContentTags(); fetchFiles(); }))); } catch (e) { console.error(e); } }
async function loadSubFolders() { const params = new URLSearchParams(); appendValues(params, 'parents', selectedParents); try { const subs = await getJson(`/api/sub-folders${params.toString() ? '?' + params : ''}`); const c = document.getElementById('subs-container'); c.replaceChildren(); subs.forEach(s => c.appendChild(makeBadge(s.name.replace('Sub:', '').trim(), String(s.id), selectedSubs, 'selected-sub', () => { loadContentTags(); fetchFiles(); }))); } catch (e) { console.error(e); } }
async function loadContentTags() { const params = new URLSearchParams(); appendValues(params, 'parents', selectedParents); appendValues(params, 'subs', selectedSubs); try { const tags = await getJson(`/api/content-tags${params.toString() ? '?' + params : ''}`); const c = document.getElementById('tags-container'); c.replaceChildren(); tags.forEach(t => c.appendChild(makeBadge(t.name, String(t.id), selectedTags, 'selected-content', fetchFiles))); } catch (e) { console.error(e); } }
async function fetchFiles() {
  const requestId = ++filesRequestId; const params = new URLSearchParams(); const query = document.getElementById('search-input').value.trim();
  if (query) params.set('q', query); appendValues(params, 'parents', selectedParents); appendValues(params, 'subs', selectedSubs); appendValues(params, 'tags', selectedTags);
  try { const files = await getJson('/api/files?' + params.toString()); if (requestId === filesRequestId) renderCards(files); } catch (e) { if (requestId === filesRequestId) { console.error(e); document.getElementById('file-count').textContent = 'Errore caricamento file'; } }
}
function processThumbnailQueue() { while (activeThumbnailJobs.size < 3 && thumbnailQueue.length) { const job = thumbnailQueue.shift(); if (job.generation !== thumbnailGeneration) continue; activeThumbnailJobs.add(job); createVideoThumbnail(job).finally(() => { activeThumbnailJobs.delete(job); processThumbnailQueue(); }); } }
function createVideoThumbnail(job) { return new Promise(resolve => { const { mediaUrl, filename, preview, icon, generation } = job; const video = document.createElement('video'); video.preload = 'metadata'; video.muted = true; video.playsInline = true; let finished = false; const timeout = setTimeout(finish, 15000); function finish(img = null) { if (finished) return; finished = true; clearTimeout(timeout); video.pause(); video.removeAttribute('src'); video.load(); if (generation === thumbnailGeneration && preview.isConnected) { if (img) { preview.insertBefore(img, icon); icon.hidden = true; } else icon.hidden = false; } resolve(); } video.addEventListener('error', () => finish(), { once: true }); video.addEventListener('loadedmetadata', () => { const d = video.duration; try { video.currentTime = Number.isFinite(d) && d > 1 ? Math.min(d / 2, 1) : 0.1; } catch { finish(); } }, { once: true }); video.addEventListener('seeked', () => { if (finished || !video.videoWidth || !video.videoHeight) return finish(); try { const canvas = document.createElement('canvas'); canvas.width = Math.min(320, video.videoWidth); canvas.height = Math.round(canvas.width * video.videoHeight / video.videoWidth); canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height); const img = document.createElement('img'); img.src = canvas.toDataURL('image/jpeg', .8); img.alt = `Anteprima di ${filename}`; finish(img); } catch { finish(); } }, { once: true }); video.src = mediaUrl; video.load(); }); }
function renderCards(files) {
  const grid = document.getElementById('cards-grid'); document.getElementById('file-count').textContent = `Trovati: ${files.length}`; thumbnailGeneration++; thumbnailObserver.disconnect(); thumbnailQueue.length = 0; activeThumbnailJobs.forEach(job => job.cancel?.()); grid.replaceChildren();
  if (!files.length) { const message = document.createElement('p'); message.className = 'empty-message'; message.textContent = 'Nessun file trovato con i filtri selezionati.'; grid.appendChild(message); return; }
  const fragment = document.createDocumentFragment(); const videoPreviews = [];
  files.forEach(file => {
    const card = document.createElement('article'); card.className = 'card'; card.title = 'Doppio clic per aprire il file'; card.addEventListener('dblclick', () => openFile(file.filepath));
    const preview = document.createElement('div'); preview.className = 'card-preview';
    const extension = String(file.filename || file.filepath).split('.').pop().toLowerCase(); const fallbackType = String(file.file_type || '').replace('.', '').toLowerCase(); const type = imageExtensions.has(extension) || videoExtensions.has(extension) ? extension : fallbackType; const isImage = imageExtensions.has(type); const isVideo = videoExtensions.has(type); const icon = document.createElement('span'); icon.className = 'file-icon'; icon.textContent = type || 'FILE';
    const mediaUrl = `/api/media?filepath=${encodeURIComponent(file.filepath)}`;
    if (isImage) { const img = document.createElement('img'); img.src = mediaUrl; img.alt = `Anteprima di ${file.filename}`; img.loading = 'lazy'; icon.hidden = true; img.addEventListener('error', () => { img.remove(); icon.hidden = false; }); preview.append(img, icon); }
    else if (isVideo) { preview.appendChild(icon); preview.thumbnailJob = { mediaUrl, filename: file.filename, preview, icon, generation: thumbnailGeneration }; videoPreviews.push(preview); const badge = document.createElement('span'); badge.className = 'video-badge'; badge.textContent = 'VIDEO'; preview.appendChild(badge); }
    else preview.appendChild(icon);
    const body = document.createElement('div'); body.className = 'card-body'; const title = document.createElement('div'); title.className = 'card-title'; title.textContent = file.filename; title.title = file.filepath;
    const path = document.createElement('div'); path.className = 'card-path'; path.textContent = file.filepath;
    const actions = document.createElement('div'); actions.className = 'card-actions';
    const selectButton = document.createElement('button'); selectButton.type = 'button'; selectButton.className = 'card-action'; selectButton.textContent = 'Mostra nella cartella'; selectButton.addEventListener('click', e => { e.stopPropagation(); selectFile(file.filepath); }); actions.appendChild(selectButton);
    const tagsContainer = document.createElement('div'); tagsContainer.className = 'card-tags'; (file.tags || []).forEach(tag => { const label = document.createElement('span'); label.className = 'card-tag'; label.textContent = typeof tag === 'object' ? tag.name : tag; tagsContainer.appendChild(label); }); body.append(title, path, actions, tagsContainer); card.append(preview, body); fragment.appendChild(card);
  });
  grid.appendChild(fragment); videoPreviews.forEach(preview => thumbnailObserver.observe(preview));
}
async function openFile(filepath) { try { const response = await fetch('/api/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filepath }) }); if (!response.ok) throw new Error(`HTTP ${response.status}`); } catch (e) { console.error('Errore apertura file:', e); } }
async function selectFile(filepath) { try { const response = await fetch('/api/select-file', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filepath }) }); if (!response.ok) throw new Error(`HTTP ${response.status}`); } catch (e) { console.error('Errore nella selezione del file:', e); } }
function resetFilters() { document.getElementById('search-input').value = ''; selectedParents.clear(); selectedSubs.clear(); selectedTags.clear(); loadParentFolders(); loadSubFolders(); loadContentTags(); fetchFiles(); }
</script>
</body>
</html>
