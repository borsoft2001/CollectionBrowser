<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollectionBrowser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR FILTRI */
        #sidebar {
            width: 340px;
            background-color: #1e1e1e;
            border-right: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #sidebar h2 {
            font-size: 1.2rem;
            color: #4da6ff;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group h3 {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            margin-bottom: 10px;
            outline: none;
            font-size: 0.9rem;
        }

        input[type="text"]:focus {
            border-color: #4da6ff;
        }

        /* CONTENITORI SCELTA MULTIPLA (TAGS/BADGES) */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
            background: #252525;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .tag-badge {
            background-color: #333;
            color: #ccc;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .tag-badge:hover {
            background-color: #444;
            color: #fff;
        }

        /* Badge Selezionati per i vari filtri */
        .tag-badge.selected-parent {
            background-color: #28a745;
            color: #fff;
        }

        .tag-badge.selected-sub {
            background-color: #e67e22;
            color: #fff;
        }

        .tag-badge.selected-content {
            background-color: #0066cc;
            color: #fff;
        }

        .btn-reset {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background-color: #444;
        }

        /* AREA CONTENUTO PRINCIPALE */
        #main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #1e1e1e;
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        #file-count {
            color: #aaa;
            font-size: 0.9rem;
        }

        /* GRIGLIA A COLONNE DINAMICHE */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        /* SCHEDA SINGOLA */
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #4da6ff;
        }

        .card-preview {
            width: 100%;
            height: 180px;
            background-color: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-preview .file-icon {
            font-size: 2.2rem;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            word-break: break-word;
            line-height: 1.3;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: auto;
            padding-top: 8px;
        }

        .card-tag {
            font-size: 0.7rem;
            background: #2a2a2a;
            color: #888;
            padding: 2px 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR FILTRI -->
    <div id="sidebar">
        <h2>CollectionBrowser</h2>

        <!-- Ricerca Testuale -->
        <div class="filter-group">
            <h3>Cerca Nome File</h3>
            <input type="text" id="search-input" placeholder="Es: Barbarian, Captain...">
        </div>

        <!-- Filtro 1: Cartelle Padre (OR - Scelta Multipla) -->
        <div class="filter-group">
            <h3>1. Cartelle Padre (OR)</h3>
            <div id="parents-container" class="tags-container">
                <!-- Badges caricate dinamicamente -->
            </div>
        </div>

        <!-- Filtro 2: Sotto-cartelle (OR - Scelta Multipla) -->
        <div class="filter-group">
            <h3>2. Sotto-cartelle (OR)</h3>
            <div id="subs-container" class="tags-container">
                <!-- Badges caricate dinamicamente -->
            </div>
        </div>

        <!-- Filtro 3: Tag Contenuto (AND - Scelta Multipla) -->
        <div class="filter-group">
            <h3>3. Tag Contenuto (AND)</h3>
            <div id="tags-container" class="tags-container">
                <!-- Badges caricate dinamicamente -->
            </div>
        </div>

        <button class="btn-reset" id="reset-filters">Azzera Filtri</button>
    </div>

    <!-- AREA CONTENUTO PRINCIPALE -->
    <div id="main-content">
        <div id="top-bar">
            <span id="file-count">Caricamento in corso...</span>
        </div>

        <!-- GRIGLIA SCHEDE DINAMICA -->
        <div id="cards-grid" class="cards-grid">
            <!-- Schede caricate dinamicamente -->
        </div>
    </div>

    <script>
        // Set per contenere le selezioni multiple
        let selectedParents = new Set();
        let selectedSubs = new Set();
        let selectedTags = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            loadParentFolders();
            loadSubFolders();
            loadContentTags();
            fetchFiles();

            // Event Listeners
            document.getElementById('search-input').addEventListener('input', fetchFiles);
            document.getElementById('reset-filters').addEventListener('click', resetFilters);
        });

        // 1. Carica Cartelle Padre (Scelta Multipla)
        async function loadParentFolders() {
            try {
                const res = await fetch('/api/parent-folders');
                const parents = await res.json();
                const container = document.getElementById('parents-container');
                container.innerHTML = '';

                parents.forEach(p => {
                    const idStr = p.id.toString();
                    const badge = document.createElement('span');
                    badge.className = 'tag-badge';
                    if (selectedParents.has(idStr)) badge.classList.add('selected-parent');
                    badge.textContent = p.name.replace('Padre:', '').trim();
                    
                    badge.addEventListener('click', () => {
                        if (selectedParents.has(idStr)) {
                            selectedParents.delete(idStr);
                            badge.classList.remove('selected-parent');
                        } else {
                            selectedParents.add(idStr);
                            badge.classList.add('selected-parent');
                        }
                        loadSubFolders();
                        loadContentTags();
                        fetchFiles();
                    });
                    container.appendChild(badge);
                });
            } catch (err) {
                console.error("Errore caricamento cartelle padre:", err);
            }
        }

        // 2. Carica Sotto-cartelle (Scelta Multipla - Filtrate in base alle Padre selezionate)
        async function loadSubFolders() {
            const params = new URLSearchParams();
            selectedParents.forEach(pId => params.append('parents', pId));

            try {
                const res = await fetch(`/api/sub-folders?${params.toString()}`);
                const subs = await res.json();
                const container = document.getElementById('subs-container');
                container.innerHTML = '';

                subs.forEach(s => {
                    const idStr = s.id.toString();
                    const badge = document.createElement('span');
                    badge.className = 'tag-badge';
                    if (selectedSubs.has(idStr)) badge.classList.add('selected-sub');
                    badge.textContent = s.name.replace('Sub:', '').trim();

                    badge.addEventListener('click', () => {
                        if (selectedSubs.has(idStr)) {
                            selectedSubs.delete(idStr);
                            badge.classList.remove('selected-sub');
                        } else {
                            selectedSubs.add(idStr);
                            badge.classList.add('selected-sub');
                        }
                        loadContentTags();
                        fetchFiles();
                    });
                    container.appendChild(badge);
                });
            } catch (err) {
                console.error("Errore caricamento sottocartelle:", err);
            }
        }

        // 3. Carica Tag Contenuto (Scelta Multipla)
        async function loadContentTags() {
            const params = new URLSearchParams();
            selectedParents.forEach(pId => params.append('parents', pId));
            selectedSubs.forEach(sId => params.append('subs', sId));

            try {
                const res = await fetch(`/api/content-tags?${params.toString()}`);
                const tags = await res.json();
                const container = document.getElementById('tags-container');
                container.innerHTML = '';

                tags.forEach(t => {
                    const idStr = t.id.toString();
                    const badge = document.createElement('span');
                    badge.className = 'tag-badge';
                    if (selectedTags.has(idStr)) badge.classList.add('selected-content');
                    badge.textContent = t.name;

                    badge.addEventListener('click', () => {
                        if (selectedTags.has(idStr)) {
                            selectedTags.delete(idStr);
                            badge.classList.remove('selected-content');
                        } else {
                            selectedTags.add(idStr);
                            badge.classList.add('selected-content');
                        }
                        fetchFiles();
                    });
                    container.appendChild(badge);
                });
            } catch (err) {
                console.error("Errore caricamento tag contenuto:", err);
            }
        }

        // Recupera ed elenca i file filtrati aprendo la query string con più parametri
        async function fetchFiles() {
            const query = document.getElementById('search-input').value.trim();

            const params = new URLSearchParams();
            if (query) params.append('q', query);
            
            selectedParents.forEach(pId => params.append('parents', pId));
            selectedSubs.forEach(sId => params.append('subs', sId));
            selectedTags.forEach(tId => params.append('tags', tId));

            try {
                const res = await fetch(`/api/files?${params.toString()}`);
                const files = await res.json();
                renderCards(files);
            } catch (err) {
                console.error("Errore recupero file:", err);
            }
        }

        // Renderizza le schede nella griglia dinamica
        function renderCards(files) {
            const grid = document.getElementById('cards-grid');
            const countLabel = document.getElementById('file-count');
            grid.innerHTML = '';

            countLabel.textContent = `Trovati ${files.length} file`;

            if (files.length === 0) {
                grid.innerHTML = '<p style="color: #666; grid-column: 1/-1; text-align: center; padding: 40px;">Nessun file trovato con i filtri selezionati.</p>';
                return;
            }

            files.forEach(file => {
                const card = document.createElement('div');
                card.className = 'card';

                // Doppio click per aprire il file nel sistema locale
                card.addEventListener('dblclick', () => openFile(file.filepath));

                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes((file.file_type || '').toLowerCase());
                let previewHtml = '';

                if (isImage) {
                    previewHtml = `<img src="/api/media?filepath=${encodeURIComponent(file.filepath)}" alt="${file.filename}" loading="lazy">`;
                } else {
                    previewHtml = `<span class="file-icon">${file.file_type || 'FILE'}</span>`;
                }

                const tagsHtml = (file.tags || [])
                    .map(t => `<span class="card-tag">${typeof t === 'object' ? t.name : t}</span>`)
                    .join('');

                card.innerHTML = `
                    <div class="card-preview">
                        ${previewHtml}
                    </div>
                    <div class="card-body">
                        <div class="card-title" title="${file.filepath}">${file.filename}</div>
                        <div class="card-tags">
                            ${tagsHtml}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Apre il file nel SO locale
        async function openFile(filepath) {
            try {
                await fetch('/api/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filepath: filepath })
                });
            } catch (err) {
                console.error("Errore apertura file:", err);
            }
        }

        // Azzera tutti i filtri selezionati
        function resetFilters() {
            document.getElementById('search-input').value = '';
            selectedParents.clear();
            selectedSubs.clear();
            selectedTags.clear();

            loadParentFolders();
            loadSubFolders();
            loadContentTags();
            fetchFiles();
        }
    </script>
</body>
</html>
